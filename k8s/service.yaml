apiVersion: v1
kind: Service
metadata:
  name: finagent
spec:
  selector:
    app: finagent
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finagent
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
