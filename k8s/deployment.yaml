apiVersion: apps/v1
kind: Deployment
metadata:
  name: finagent
  labels:
    app: finagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finagent
  template:
    metadata:
      labels:
        app: finagent
    spec:
      containers:
        - name: finagent
          image: finagent:latest
          ports:
            - containerPort: 8080
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: finagent-secrets
                  key: anthropic-api-key
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
